[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pentesting-web-crawler"
version = "0.1.0"
description = "Pentesting web crawler for security analysis of websites — tracking, cookies, network flows, geo intelligence and script inspection"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "jinja2>=3.1.5",
    "playwright>=1.51.0",
    "plotly>=6.0.0",
    "httpx>=0.28.1",
    "tldextract>=5.1.3",
    "python-multipart>=0.0.20",
    "dnspython>=2.7.0",
    "reportlab>=4.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.5",
    "pytest-asyncio>=0.25.3",
    "ruff>=0.11.0",
]

[tool.setuptools]
package-dir = {"": "."}
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
